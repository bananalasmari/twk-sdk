<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>ELM | TWK SDK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#01527A">
  <meta name="author" content="Elm">
  <meta http-equiv="Content-Language" content="en,ar">
  <meta name="description" content="حزمة توكلنا">
  <meta name="keywords" content="حزمة توكلنا">

  <!-- OG Tags for Social Media Sharing -->
  <meta property="og:title" content="حزمة توكلنا">
  <meta property="og:description" content="حزمة توكلنا">
  <meta property="og:image" content="">
  <meta property="og:type" content="website">

  <!-- Twitter Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="حزمة توكلنا">
  <meta name="twitter:description" content="حزمة توكلنا">
  <meta name="twitter:image" content="">

  <script src="./assets/js/twkhelper.js"></script>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #050814;
    }

    .loading-div {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background:
        radial-gradient(circle at 10% 0, rgba(95, 25, 8, 0.38), #000000 55%),
        linear-gradient(140deg, #051d49 0%, #000000 40%, #051d49 100%);
    }

    .loading-div .loading-elm-logo {
      width: 140px;
      height: auto;
    }

    .loading-div .loading-mark {
      position: relative;
      width: 88px;
      height: 88px;
    }

    .loading-div .loading-ring,
    .loading-div .loading-ring-soft {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .loading-div .loading-ring {
      border-top-color: #ff5d36;
      border-right-color: #ff5d36;
      animation: public-loader-spin 0.85s linear infinite;
    }

    .loading-div .loading-ring-soft {
      inset: 8px;
      border-bottom-color: #763cbc;
      border-left-color: rgba(118, 60, 188, 0.35);
      animation: public-loader-spin 1.25s linear infinite reverse;
    }

    .loading-div .loading-logo {
      position: absolute;
      inset: 22px;
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .loading-div.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    @keyframes public-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="public-loader" class="loading-div" role="status" aria-live="polite" aria-label="Loading">
    <div class="loading-mark">
      <span class="loading-ring"></span>
      <span class="loading-ring-soft"></span>
      <img class="loading-logo" src="assets/images/elmlogoWhite.svg" alt="Tawakkalna">
    </div>
  </div>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
